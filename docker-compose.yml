services:
  frontend:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"

  backend:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    command: npm run dev
    ports:
      - "3000:3000"

  postgres:
    image: postgres:latest
    container_name: postgres-db
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: